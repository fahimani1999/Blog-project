{% extends 'base.html' %}

{% block title %}{{ page_title }} - My Blog{% endblock %}

{% block content %}
<section class="container">
    <h1>{{ page_title }}</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Post</button>
    </form>
</section>
{% endblock %}
