{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}My Blog{% endblock %}</title>
        <link rel="stylesheet" href="{% static 'style.css' %}">
    </head>

    <body>
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="nav-container">
                <a href="{% url 'home' %}" class="logo">My Blog</a>

                <div class="nav-links">
                    <a href="{% url 'home' %}">Home</a>

                    {% if user.is_authenticated %}
                        <span class="welcome">Hello, {{ user.username }}</span>
                        <a href="{% url 'my_posts' %}">My Posts</a>
                        <a href="{% url 'create_post' %}" class="nav-button">Create Post</a>
                        <a href="{% url 'logout' %}">Logout</a>
                    {% else %}
                        <a href="{% url 'login' %}">Login</a>
                        <a href="{% url 'register' %}" class="nav-button">Register</a>
                    {% endif %}
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="container">
            {% block content %}
            {% endblock %}
        </main>
    </body>
</html>
