{% extends 'base.html' %}

{% block title %}Delete Post - My Blog{% endblock %}

{% block content %}
<section class="container">
    <h1>Delete Post</h1>
    <p>Are you sure you want to delete "{{ post.title }}"?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Delete Post</button>
        <a href="{% url 'post_detail' post.id %}">Cancel</a>
    </form>
</section>
{% endblock %}
